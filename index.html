<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Mastery - Become a Genius</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #6366f1; --secondary: #8b5cf6; --success: #10b981;
            --warning: #f59e0b; --danger: #ef4444; --dark: #1e293b;
            --light: #f1f5f9; --bg: #ffffff; --text: #1e293b;
            --border: #e2e8f0; --shadow: rgba(0, 0, 0, 0.1);
        }
        [data-theme="dark"] {
            --bg: #0f172a; --text: #f1f5f9; --dark: #1e293b;
            --light: #334155; --border: #334155; --shadow: rgba(0, 0, 0, 0.3);
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg); color: var(--text); transition: all 0.3s ease;
        }
        .login-screen {
            min-height: 100vh; display: flex; align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
        }
        .login-container {
            background: var(--bg); padding: 3rem; border-radius: 20px;
            box-shadow: 0 20px 60px var(--shadow); text-align: center;
            max-width: 400px; width: 90%; animation: slideUp 0.5s ease;
        }
        .login-header i { font-size: 4rem; color: var(--primary); margin-bottom: 1rem; }
        .login-header h1 { font-size: 2rem; margin-bottom: 0.5rem; }
        .login-header p { color: #64748b; margin-bottom: 2rem; }
        .google-login-btn {
            width: 100%; padding: 1rem; background: #4285f4; color: white;
            border: none; border-radius: 10px; font-size: 1rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
            transition: all 0.3s ease;
        }
        .google-login-btn:hover {
            background: #357ae8; transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(66, 133, 244, 0.3);
        }
        .nickname-section {
            margin-top: 1.5rem; animation: fadeIn 0.5s ease;
        }
        .nickname-section input {
            width: 100%; padding: 1rem; border: 2px solid var(--border);
            border-radius: 10px; font-size: 1rem; margin-bottom: 1rem;
            background: var(--bg); color: var(--text);
        }
        .save-btn {
            width: 100%; padding: 1rem; background: var(--success); color: white;
            border: none; border-radius: 10px; font-size: 1rem; cursor: pointer;
            transition: all 0.3s ease;
        }
        .save-btn:hover { background: #059669; transform: translateY(-2px); }
        .main-app {
            display: grid; grid-template-columns: 250px 1fr;
            grid-template-rows: 70px 1fr; min-height: 100vh;
        }
        .navbar {
            grid-column: 1 / -1; background: var(--bg);
            border-bottom: 1px solid var(--border); padding: 0 2rem;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 2px 10px var(--shadow);
        }
        .nav-brand {
            display: flex; align-items: center; gap: 0.5rem;
            font-size: 1.5rem; font-weight: bold; color: var(--primary);
        }
        .nav-user { display: flex; align-items: center; gap: 1rem; }
        .theme-toggle, .logout-btn {
            background: var(--light); border: none; padding: 0.5rem 1rem;
            border-radius: 8px; cursor: pointer; color: var(--text);
            transition: all 0.3s ease;
        }
        .theme-toggle:hover, .logout-btn:hover {
            background: var(--primary); color: white; transform: translateY(-2px);
        }
        .sidebar {
            background: var(--bg); border-right: 1px solid var(--border);
            padding: 1.5rem; overflow-y: auto;
        }
        .search-box { position: relative; margin-bottom: 1.5rem; }
        .search-box i {
            position: absolute; left: 1rem; top: 50%;
            transform: translateY(-50%); color: #64748b;
        }
        .search-box input {
            width: 100%; padding: 0.75rem 1rem 0.75rem 2.5rem;
            border: 2px solid var(--border); border-radius: 10px;
            background: var(--bg); color: var(--text);
        }
        .sidebar-menu { list-style: none; }
        .sidebar-menu li {
            padding: 1rem; margin-bottom: 0.5rem; border-radius: 10px;
            cursor: pointer; transition: all 0.3s ease;
            display: flex; align-items: center; gap: 0.75rem;
        }
        .sidebar-menu li:hover {
            background: var(--light); transform: translateX(5px);
        }
        .sidebar-menu li.active { background: var(--primary); color: white; }
        .main-content {
            padding: 2rem; overflow-y: auto; background: var(--light);
        }
        .card {
            background: var(--bg); border-radius: 15px; padding: 1.5rem;
            margin-bottom: 1.5rem; box-shadow: 0 4px 15px var(--shadow);
            transition: all 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px); box-shadow: 0 8px 25px var(--shadow);
        }
        .card-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 1rem; padding-bottom: 1rem;
            border-bottom: 2px solid var(--border);
        }
        .card-title {
            font-size: 1.5rem; font-weight: bold; color: var(--primary);
        }
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }
        .grid-4 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }
        .btn {
            padding: 0.75rem 1.5rem; border: none; border-radius: 10px;
            cursor: pointer; font-size: 1rem; transition: all 0.3s ease;
            display: inline-flex; align-items: center; gap: 0.5rem;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-warning { background: var(--warning); color: white; }
        .btn:hover {
            transform: translateY(-2px); box-shadow: 0 5px 15px var(--shadow);
        }
        .progress-bar {
            width: 100%; height: 10px; background: var(--border);
            border-radius: 10px; overflow: hidden; margin: 1rem 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.5s ease;
        }
        .badge {
            display: inline-block; padding: 0.25rem 0.75rem;
            border-radius: 20px; font-size: 0.875rem; font-weight: bold;
        }
        .badge-success { background: var(--success); color: white; }
        .badge-warning { background: var(--warning); color: white; }
        .badge-primary { background: var(--primary); color: white; }
        .code-editor {
            background: #1e1e1e; border-radius: 10px; padding: 1rem; margin: 1rem 0;
        }
        .code-editor textarea {
            width: 100%; min-height: 300px; background: #1e1e1e; color: #d4d4d4;
            border: none; font-family: 'Courier New', monospace; font-size: 14px;
            padding: 1rem; resize: vertical;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .hidden { display: none !important; }
        @media (max-width: 768px) {
            .main-app { grid-template-columns: 1fr; }
            .sidebar { display: none; }
            .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="loginScreen" class="login-screen">
        <div class="login-container">
            <div class="login-header">
                <i class="fas fa-brain"></i>
                <h1>Tech Mastery</h1>
                <p>Your Journey to Becoming a Tech Genius</p>
            </div>
            <button id="googleLoginBtn" class="google-login-btn">
                <i class="fab fa-google"></i>
                Sign in with Google
            </button>
            <div id="nicknameSection" class="nickname-section hidden">
                <input type="text" id="nicknameInput" placeholder="Enter your nickname" maxlength="20">
                <button id="saveNicknameBtn" class="save-btn">Start Learning</button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="main-app hidden">
        <nav class="navbar">
            <div class="nav-brand">
                <i class="fas fa-brain"></i>
                <span>Tech Mastery</span>
            </div>
            <div class="nav-user">
                <span id="userNickname"></span>
                <button id="themeToggle" class="theme-toggle">
                    <i class="fas fa-moon"></i>
                </button>
                <button id="logoutBtn" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </nav>

        <aside class="sidebar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search anything...">
            </div>
            <ul class="sidebar-menu">
                <li data-section="dashboard" class="active"><i class="fas fa-home"></i> Dashboard</li>
                <li data-section="fields"><i class="fas fa-code"></i> Tech Fields</li>
                <li data-section="challenges"><i class="fas fa-trophy"></i> Challenges</li>
                <li data-section="playground"><i class="fas fa-play"></i> Code Playground</li>
                <li data-section="genius"><i class="fas fa-brain"></i> Genius Exercises</li>
                <li data-section="missions"><i class="fas fa-rocket"></i> Missions</li>
                <li data-section="hackathons"><i class="fas fa-laptop-code"></i> Hackathons</li>
                <li data-section="playlist"><i class="fas fa-music"></i> Tech Playlist</li>
                <li data-section="news"><i class="fas fa-newspaper"></i> Tech News</li>
                <li data-section="achievements"><i class="fas fa-medal"></i> Achievements</li>
                <li data-section="certificate"><i class="fas fa-certificate"></i> Certificate</li>
            </ul>
        </aside>

        <main class="main-content">
            <div id="contentArea"></div>
        </main>
    </div>

    </script>
</body>
</html>
