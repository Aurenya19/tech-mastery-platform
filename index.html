<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tech Mastery Platform</title>
<link rel="icon" href="https://v3b.fal.media/files/b/0a8ad14e/GE_Wzfl1a5H9Td5gNi53d_f8f2269ad287445285436dbdb5e1a215.jpg">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:#0a0e1a;color:#e5e7eb}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2)}.login-box{background:rgba(255,255,255,0.95);padding:3rem;border-radius:25px;text-align:center;max-width:450px;width:90%;box-shadow:0 25px 80px rgba(0,0,0,0.4)}.login-box img{width:120px;height:120px;border-radius:20px;margin-bottom:1rem}.login-box h1{font-size:2.2rem;color:#1a202c;margin-bottom:1rem}input,textarea{width:100%;padding:1rem;border:2px solid #667eea;border-radius:12px;font-size:1rem;margin:1rem 0;background:#0d1117;color:#e5e7eb}button{width:100%;padding:1.2rem;border:none;border-radius:12px;font-size:1.1rem;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;transition:all .3s}button:hover{transform:translateY(-3px)}.app{display:grid;grid-template-columns:280px 1fr;grid-template-rows:70px 1fr;min-height:100vh}.navbar{grid-column:1/-1;background:linear-gradient(135deg,#1a1f35,#151b2e);border-bottom:2px solid #667eea;padding:0 2rem;display:flex;align-items:center;justify-content:space-between}.sidebar{background:#151b2e;border-right:2px solid #1f2937;padding:2rem 1rem}.sidebar ul{list-style:none}.sidebar li{padding:1.2rem;margin-bottom:.75rem;border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:1rem;transition:all .3s;font-weight:600}.sidebar li:hover{background:#1e2538;transform:translateX(8px)}.sidebar li.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}.content{padding:2.5rem;overflow-y:auto;max-height:calc(100vh - 70px);background:#0a0e1a}.card{background:linear-gradient(135deg,#1a1f35,#151b2e);border-radius:20px;padding:2.5rem;margin-bottom:2rem;border:2px solid #667eea}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:2rem;margin-top:2rem}.stat-card{background:linear-gradient(135deg,#1a1f35,#151b2e);border-radius:20px;padding:2.5rem;border:2px solid #667eea;text-align:center}.stat-card .value{font-size:3.5rem;font-weight:900;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}h1{font-size:2.8rem;margin-bottom:1rem;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900}.welcome-banner{background:linear-gradient(135deg,#667eea,#764ba2);padding:2rem;border-radius:20px;margin-bottom:2rem;color:#fff}.welcome-banner h1{color:#fff;-webkit-text-fill-color:#fff}.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:1000;align-items:center;justify-content:center}.modal.active{display:flex}.modal-content{background:linear-gradient(135deg,#1a1f35,#151b2e);border-radius:25px;padding:2.5rem;max-width:950px;width:90%;max-height:90vh;overflow-y:auto;border:2px solid #667eea}.modal-close{float:right;font-size:2.5rem;cursor:pointer;color:#9ca3af}.video-container{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:15px;margin:1rem 0}.video-container iframe{position:absolute;top:0;left:0;width:100%;height:100%}.code-editor textarea{background:#0d1117;color:#e5e7eb;border:1px solid #30363d;min-height:300px;font-family:'Courier New',monospace;font-size:14px;border-radius:10px}.badge{display:inline-block;padding:.6rem 1.2rem;border-radius:25px;font-size:.85rem;font-weight:700;margin:.25rem}.badge-primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}.badge-success{background:linear-gradient(135deg,#10b981,#059669);color:#fff}.badge-warning{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#0a0e1a}.badge-info{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff}@media(max-width:768px){.app{grid-template-columns:1fr}.sidebar{display:none}}</style>
</head>
<body>
<div id="app"></div>
<script>const LOGO='https://v3b.fal.media/files/b/0a8ad14e/GE_Wzfl1a5H9Td5gNi53d_f8f2269ad287445285436dbdb5e1a215.jpg';const DATA={books:[{id:1,title:'JavaScript: The Good Parts',author:'Douglas Crockford',url:'https://github.com/getify/You-Dont-Know-JS'},{id:2,title:'Python Crash Course',author:'Eric Matthes',url:'https://github.com/ehmatthes/pcc'},{id:3,title:'Clean Code',author:'Robert Martin',url:'https://github.com/jnguyen095/clean-code'}],videos:[{id:1,title:'JavaScript Full Course',channel:'freeCodeCamp',videoId:'PkZNo7MFNFg'},{id:2,title:'Python for Beginners',channel:'Mosh',videoId:'_uQrJ0TkZlc'},{id:3,title:'React Tutorial',channel:'Traversy Media',videoId:'w7ejDZ8SWv8'}],challenges:[{id:1,title:'Reverse String',desc:'Write a function that reverses a string',hint:'Use array methods',testCases:[{input:'"hello"',output:'"olleh"'}],starter:'function reverseString(str) {\n  // Your code\n}'},{id:2,title:'FizzBuzz',desc:'Print Fizz for multiples of 3, Buzz for 5, FizzBuzz for both',hint:'Use modulo operator',testCases:[{input:'15',output:'FizzBuzz'}],starter:'function fizzBuzz(n) {\n  // Your code\n}'}]};let user=JSON.parse(localStorage.getItem('user'))||null,progress=JSON.parse(localStorage.getItem('progress'))||{booksRead:[],videosWatched:[],challengesSolved:[]};function init(){user?showApp():showLogin()}function showLogin(){document.getElementById('app').innerHTML=`<div class="login"><div class="login-box"><img src="${LOGO}"><h1>Tech Mastery Platform</h1><p>3 Books • 3 Videos • 2 Challenges</p><input type="text" id="nameInput" placeholder="Enter your name" autofocus style="background:#fff;color:#000"><button onclick="login()">Start Learning</button></div></div>`}function login(){const name=document.getElementById('nameInput').value.trim();name?(user={name},localStorage.setItem('user',JSON.stringify(user)),showApp()):alert('Please enter your name!')}function showApp(){document.getElementById('app').innerHTML=`<div class="app"><nav class="navbar"><div style="color:#667eea;font-size:1.5rem;font-weight:800">Tech Mastery</div><div style="color:#fff">${user.name} <button onclick="logout()" style="width:auto;padding:.5rem 1rem;margin-left:1rem;background:#ef4444">Logout</button></div></nav><aside class="sidebar"><ul><li class="active" onclick="go('dash')"><i class="fas fa-home"></i> Dashboard</li><li onclick="go('books')"><i class="fas fa-book"></i> Books</li><li onclick="go('videos')"><i class="fas fa-video"></i> Videos</li><li onclick="go('challenges')"><i class="fas fa-code"></i> Challenges</li></ul></aside><main class="content" id="content">${getDash()}</main></div><div id="modal" class="modal" onclick="if(event.target===this)closeModal()"></div>`}function logout(){confirm('Logout?')&&(user=null,localStorage.removeItem('user'),location.reload())}function go(s){document.querySelectorAll('.sidebar li').forEach(li=>li.classList.remove('active'));event.target.closest('li').classList.add('active');const c=document.getElementById('content');s==='dash'?c.innerHTML=getDash():s==='books'?c.innerHTML=getBooks():s==='videos'?c.innerHTML=getVideos():s==='challenges'&&(c.innerHTML=getChallenges())}function getDash(){return`<div class="welcome-banner"><h1>Welcome, ${user.name}! 🚀</h1></div><div class="grid"><div class="stat-card"><h3>Books Read</h3><div class="value">${progress.booksRead.length}/3</div></div><div class="stat-card"><h3>Videos Watched</h3><div class="value">${progress.videosWatched.length}/3</div></div><div class="stat-card"><h3>Challenges Solved</h3><div class="value">${progress.challengesSolved.length}/2</div></div></div>`}function getBooks(){return`<h1>📚 Books</h1><div class="grid">${DATA.books.map(b=>`<div class="card"><h3>${b.title}</h3><p>${b.author}</p><button onclick="window.open('${b.url}','_blank')">Read Book</button></div>`).join('')}</div>`}function getVideos(){return`<h1>🎥 Videos</h1><div class="grid">${DATA.videos.map(v=>`<div class="card"><h3>${v.title}</h3><p>${v.channel}</p><button onclick="watchVideo(${v.id})">Watch Video</button></div>`).join('')}</div>`}function getChallenges(){return`<h1>💻 Challenges</h1><div class="grid">${DATA.challenges.map(c=>`<div class="card"><h3>${c.title}</h3><p>${c.desc}</p><button onclick="openChallenge(${c.id})">Solve Challenge</button></div>`).join('')}</div>`}function watchVideo(id){const v=DATA.videos.find(x=>x.id===id),m=document.getElementById('modal');m.innerHTML=`<div class="modal-content"><span class="modal-close" onclick="closeModal()">&times;</span><h2>${v.title}</h2><div class="video-container"><iframe src="https://www.youtube.com/embed/${v.videoId}" frameborder="0" allowfullscreen></iframe></div><button onclick="markWatched(${id})" style="margin-top:1rem">Mark as Watched</button></div>`;m.classList.add('active')}function markWatched(id){progress.videosWatched.includes(id)||(progress.videosWatched.push(id),localStorage.setItem('progress',JSON.stringify(progress)),alert('Marked as watched!'),closeModal(),go('videos'))}function openChallenge(id){const c=DATA.challenges.find(x=>x.id===id),m=document.getElementById('modal');m.innerHTML=`<div class="modal-content"><span class="modal-close" onclick="closeModal()">&times;</span><h2>${c.title}</h2><p>${c.desc}</p><p style="color:#fbbf24">💡 Hint: ${c.hint}</p><h4>Test Cases:</h4>${c.testCases.map(tc=>`<div style="background:#0d1117;padding:1rem;margin:.5rem 0;border-radius:8px">Input: ${tc.input}<br>Output: ${tc.output}</div>`).join('')}<div class="code-editor"><textarea id="codeInput">${c.starter}</textarea></div><button onclick="submitChallenge(${id})" style="margin-top:1rem">Submit Solution</button></div>`;m.classList.add('active')}function submitChallenge(id){const code=document.getElementById('codeInput').value.trim();code&&(progress.challengesSolved.includes(id)||(progress.challengesSolved.push(id),localStorage.setItem('progress',JSON.stringify(progress)),alert('Challenge solved!'),closeModal(),go('challenges')))}function closeModal(){document.getElementById('modal').classList.remove('active')}init();</script>
</body>
</html>
